<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepPenguin | AI Classifier</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome İkonları (Form içi ikonlar için) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Bağlantısı -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- Robot yerine Penguen Resmi Eklendi -->
            <div class="logo-icon">
                <img src="https://raw.githubusercontent.com/twitter/twemoji/master/assets/svg/1f427.svg" alt="Penguin Logo" class="penguin-img">
            </div>
            <h1>DeepPenguin AI</h1>
            <p>Derin Öğrenme Tabanlı Tür Sınıflandırma Modeli</p>
        </div>
        
        <div class="form-grid">
            <div class="input-group">
                <label><i class="fa-solid fa-ruler-horizontal"></i> Gaga Uzunluğu (mm)</label>
                <input type="number" id="culmen_length" value="45.0" step="0.1">
            </div>
            
            <div class="input-group">
                <label><i class="fa-solid fa-ruler-vertical"></i> Gaga Kalınlığı (mm)</label>
                <input type="number" id="culmen_depth" value="15.0" step="0.1">
            </div>
            
            <div class="input-group">
                <label><i class="fa-solid fa-feather-pointed"></i> Kanat Uzunluğu (mm)</label>
                <input type="number" id="flipper_length" value="200.0" step="1.0">
            </div>
            
            <div class="input-group">
                <label><i class="fa-solid fa-weight-scale"></i> Vücut Ağırlığı (g)</label>
                <input type="number" id="body_mass" value="4000.0" step="10.0">
            </div>
        </div>

        <button id="predict-btn" onclick="makePrediction()">
            <span id="btn-text">Tahmin Et</span>
            <i id="btn-icon" class="fa-solid fa-wand-magic-sparkles"></i>
        </button>

        <div id="result-box" class="hidden">
            <h2>Tahmin Edilen Tür: <br><span id="predicted-species" class="highlight-text"></span></h2>
            <div id="probabilities-container"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
